<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: sans-serif;
        }

        .login {
            max-width: 402px;
            padding: 120px 24px 24px 24px;
            gap: 32px;
            flex-direction: column;
            display: flex;
            margin: 0 auto;
        }

        form {
            gap: 12px;
            flex-direction: column;
            display: flex;
            /* 방향을 결정함 column은 세로로 정렬뜻함*/

        }

        input {
            height: 48px;
            padding-left: 16px;
            border: 1px solid #DDD;
            border-radius: 8px;
        }

        button {
            height: 52px;
            background-color: #111;
            border-radius: 8px;
            border: none;
            color: #fff;
            background-color: #3B82F6;
        }

        h1 {
            font-size: 24px;
            margin: 0;
        }

        a {
            font-size: 14px;
            color: gray;
            text-align: center;
        }
    </style>
</head>

<body>
    <main class="login">
        <h1>로그인</h1>
        <form>
            <input type="email" placeholder="이메일">
            <input type="password" placeholder="비밀번호">
            <button type="submit">로그인</button>
        </form>
        <a href="#">비밀번호를 잊으셨나요?</a>
    </main>
</body>

</html>
